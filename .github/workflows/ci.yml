name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

  dbt-quality:
    name: dbt quality

    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: placeholder-project
      DBT_DATASET: entsoe_dbt_dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dbt
        run: python -m pip install -r requirements-dbt.txt

      - name: Parse dbt project
        run: dbt parse --project-dir dbt --profiles-dir dbt

      - name: List dbt resources
        run: dbt ls --project-dir dbt --profiles-dir dbt

  airflow-quality:
    name: Airflow quality
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "3.3.1"
      PYTHON_VERSION: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Airflow
        run: |
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-no-providers-${PYTHON_VERSION}.txt"
          python -m pip install -r requirements-airflow.txt --constraint "$CONSTRAINT_URL"

      - name: Install project
        run: |
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-no-providers-${PYTHON_VERSION}.txt"
          python -m pip install -e . --constraint "$CONSTRAINT_URL"

      - name: Check Airflow dependencies
        run: python -m pip check

      - name: Validate Airflow DAG
        run: |
          env \
            -u ENTSOE_API_TOKEN \
            -u GCS_RAW_BUCKET \
            -u GCP_PROJECT_ID \
            -u DBT_DATASET \
            python - <<'PY'
          import importlib.util
          from datetime import timedelta
          from pathlib import Path

          import pendulum
          from airflow.timetables.base import TimeRestriction
          from airflow.timetables.interval import CronDataIntervalTimetable

          dag_path = Path("airflow/dags/entsoe_daily_pipeline.py").resolve()

          spec = importlib.util.spec_from_file_location(
              "entsoe_daily_pipeline",
              dag_path,
          )

          if spec is None or spec.loader is None:
              raise RuntimeError("Unable to create DAG module spec")

          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          dag = module.dag
          dag.validate()

          assert dag.dag_id == "entsoe_daily_pipeline"
          assert len(dag.tasks) == 4
          assert len(module.BIDDING_ZONE_CODES) == 10
          assert len(set(module.BIDDING_ZONE_CODES)) == 10
          assert dag.max_active_runs == 1
          assert dag.max_active_tasks == 3
          assert isinstance(dag.timetable, CronDataIntervalTimetable)

          interval_info = dag.timetable.next_dagrun_info(
              last_automated_data_interval=None,
              restriction=TimeRestriction(
                  earliest=pendulum.datetime(
                      2026,
                      8,
                      20,
                      tz="UTC",
                  ),
                  latest=None,
                  catchup=True,
              ),
          )

          assert interval_info is not None
          assert (
              interval_info.data_interval.end
              - interval_info.data_interval.start
          ) == timedelta(days=1)

          for task_id in (
              "ingest_actual_load",
              "ingest_actual_generation",
              "ingest_day_ahead_prices",
          ):
              task = dag.get_task(task_id)
              assert task.max_active_tis_per_dag == 1
              assert task.retries == 2

          dbt_task = dag.get_task("run_dbt_build")
          assert dbt_task.retries == 1

          print("Airflow DAG validation passed.")
          PY
