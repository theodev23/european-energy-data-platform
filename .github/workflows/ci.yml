name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

  dbt-quality:
    name: dbt quality

    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: placeholder-project
      DBT_DATASET: entsoe_dbt_dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dbt
        run: python -m pip install -r requirements-dbt.txt

      - name: Parse dbt project
        run: dbt parse --project-dir dbt --profiles-dir dbt

      - name: List dbt resources
        run: dbt ls --project-dir dbt --profiles-dir dbt
